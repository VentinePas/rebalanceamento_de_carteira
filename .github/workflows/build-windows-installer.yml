
name: Criar instalador do Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar os arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Gerar executável
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name RebalanceamentoCarteira "Rebalanceamento de Carteira.py"

      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Gerar instalador
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "instalador_rebalanceamento.iss"

      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-Rebalanceamento-Carteira
          path: Output/Instalador_Rebalanceamento_Carteira.exe
          if-no-files-found: error
